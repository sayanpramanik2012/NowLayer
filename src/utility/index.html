<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self';">
    <title>NowLayer Time & Timer</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main id="widget" class="widget" aria-label="NowLayer time and timer widget">
      <div class="drag-region" aria-hidden="true"></div>
      <div class="brand-mark" aria-hidden="true">N</div>
      <div class="clock"><small>LOCAL TIME</small><strong id="clock">--:--</strong><div id="analogClock" class="analog-clock" role="img" aria-label="Analog clock"><span class="clock-number number-12">12</span><span class="clock-number number-3">3</span><span class="clock-number number-6">6</span><span class="clock-number number-9">9</span><span class="hand hour-hand" id="hourHand"></span><span class="hand minute-hand" id="minuteHand"></span><span class="hand second-hand" id="secondHand"></span><span class="clock-pin"></span></div></div>
      <div class="timer"><small id="timerLabel">TIMER</small><strong id="timer">00:00</strong></div>
      <div id="alert" class="alert" hidden>TIME'S UP</div>
    </main>
    <script src="app.js"></script>
  </body>
</html>
