# One-time cleanup requested with the 1.1.1 UI/performance update (PR #11).
# Normal pushes do not trigger this workflow unless this file itself changes.
name: Clean up merged branches
on:
  push:
    branches: [main]
    paths: [.github/workflows/cleanup-merged-branches.yml]
permissions:
  contents: write
  pull-requests: read
jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Delete only the reviewed, unchanged merged branches
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: python
        run: |
          import json
          import os
          import urllib.error
          import urllib.request

          repo = os.environ['REPOSITORY']
          if repo != 'sayanpramanik2012/NowLayer':
              raise SystemExit('Cleanup is scoped to the requested repository.')
          base = f'https://api.github.com/repos/{repo}'
          headers = {'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                     'Accept': 'application/vnd.github+json',
                     'X-GitHub-Api-Version': '2022-11-28'}
          def api(path, method='GET'):
              request = urllib.request.Request(base + path, headers=headers, method=method)
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      content = response.read()
                      return json.loads(content) if content else None
              except urllib.error.HTTPError as error:
                  if error.code == 404 and method == 'GET':
                      return None
                  raise

          candidates = [('feat/lean-customizable-ui', 11, None)]
          for branch, number, expected in candidates:
              pull = api(f'/pulls/{number}')
              if not pull or not pull['merged'] or pull['base']['ref'] != 'main':
                  raise RuntimeError(f'PR #{number} is not merged into main.')
              proof_branch = branch
              if pull['head']['ref'] != proof_branch or pull['head']['repo']['full_name'] != repo:
                  raise RuntimeError(f'Unexpected source branch for PR #{number}.')
              expected = expected or pull['head']['sha']
              ref = api('/git/ref/heads/' + branch)
              if ref is None:
                  print(f'{branch}: already removed')
                  continue
              if ref['object']['sha'] != expected:
                  raise RuntimeError(f'{branch} has changed; leaving it intact.')
              expected_tree = api('/git/commits/' + expected)['tree']['sha']
              merged_tree = api('/git/commits/' + pull['head']['sha'])['tree']['sha']
              if expected_tree != merged_tree:
                  raise RuntimeError(f'{branch} differs from the merged work; leaving it intact.')
              api('/git/refs/heads/' + branch, method='DELETE')
              print(f'{branch}: deleted after merged-PR and commit checks')
